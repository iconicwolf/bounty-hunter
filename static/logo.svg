<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BountyHunter logo">
  <title>BountyHunter</title>
  <defs>
    <linearGradient id="bh-gold" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="180" y2="190">
      <stop offset="0" stop-color="#F1D675"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9A7414"/>
    </linearGradient>
    <linearGradient id="bh-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14284B"/>
      <stop offset="1" stop-color="#0A192F"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal emblem -->
  <polygon points="100,6 181.4,53 181.4,147 100,194 18.6,147 18.6,53"
           fill="url(#bh-navy)" stroke="url(#bh-gold)" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="100,16 172.7,58 172.7,142 100,184 27.3,142 27.3,58"
           fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1" stroke-linejoin="round"/>

  <!-- Crosshair: ring + four ticks -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="url(#bh-gold)" stroke-width="6"/>
  <g stroke="url(#bh-gold)" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="30" x2="100" y2="58"/>
    <line x1="100" y1="142" x2="100" y2="170"/>
    <line x1="30" y1="100" x2="58" y2="100"/>
    <line x1="142" y1="100" x2="170" y2="100"/>
  </g>

  <!-- Bullseye -->
  <rect x="88" y="88" width="24" height="24" rx="3" transform="rotate(45 100 100)" fill="url(#bh-gold)"/>
  <circle cx="100" cy="100" r="5" fill="#0A192F"/>
</svg>
