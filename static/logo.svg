<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Subtle Glow) -->
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- The Shield/Briefcase Hybrid -->
  <path d="M70 60 L130 60 L135 130 Q135 140 125 140 L75 140 Q65 140 65 130 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Handle -->
  <path d="M85 60 L85 50 Q85 45 90 45 L110 45 Q115 45 115 50 L115 60" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Crosshair Elements (Minimalist) -->
  <line x1="100" y1="30" x2="100" y2="50" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="150" x2="100" y2="170" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="100" x2="50" y2="100" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="150" y1="100" x2="170" y2="100" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Center Target Point -->
  <circle cx="100" cy="100" r="3" fill="#FCD34D" />

  <!-- Text (Modern Serif/Sans) -->
  <text x="100" y="180" text-anchor="middle" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="14" letter-spacing="2">BOUNTYHUNTER</text>
</svg>
