<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle - Corporate Navy -->
  <circle cx="100" cy="100" r="98" fill="#0A192F" stroke="#D4AF37" stroke-width="1" />

  <!-- The Symbol: Minimalist BH Target -->
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="10 5" />

  <!-- Inner Target -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#D4AF37" stroke-width="4" />

  <!-- Geometric "B" and "H" stylized as crosshairs -->
  <path d="M85 80 L85 120 M115 80 L115 120 M85 100 L115 100" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" />
  <path d="M80 80 L120 80 M80 120 L120 120" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />

  <!-- Central Point -->
  <circle cx="100" cy="100" r="4" fill="#FFF" />

  <!-- Small Corporate Text -->
  <text x="100" y="160" text-anchor="middle" fill="#D4AF37" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="3">BOUNTYHUNTER</text>
  <text x="100" y="175" text-anchor="middle" fill="#8892B0" font-family="Arial, sans-serif" font-size="8" letter-spacing="1">AGENTIC CAREER OS</text>
</svg>
